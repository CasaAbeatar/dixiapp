name: Publicar la web (GitHub Pages)

# Publica la carpeta web/ en https://dixiapp.dmalabomba.com cada vez que cambia la rama principal.
# La carpeta web/ ya trae el archivo CNAME; no se usa ningun secreto (la llave de Supabase es la publicable).
on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Pruebas de datos
        run: npm test
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: web }
      - id: despliegue
        uses: actions/deploy-pages@v4
